Prop.LockSubject="Lock onto the selected person"
Prop.LockSubject.Desc="Keeps following the same person even when someone else walks across the stage. Uses only position and motion - no face recognition."
Prop.Confidence="Detection confidence threshold"
Stage.Info="Stage area: only people whose FEET are inside it are picked up. Set the bottom edge just below the stage floor to keep the camera off the congregation in front (their bodies are cut off by the bottom of the picture). A locked preacher is still followed if they step out of it. Turn on 'Show guides' to see it."
Prop.StageLeft="Stage area left edge"
Prop.StageRight="Stage area right edge"
Prop.StageTop="Stage area top edge"
Prop.StageBottom="Stage area bottom edge"
Prop.IgnoreBottom="Ignore people cut off by the bottom of the picture"
Prop.IgnoreBottom.Desc="Front-row heads and shoulders in the foreground are cut off by the bottom edge. Leave off if the camera frames the preacher so tightly that their legs are cut off."

Prop.BodyFraction="Shot size (portion of the person shown)"
Prop.BodyFraction.Desc="100% = full body, 55% = waist up, 40% = chest up, 25% = head and shoulders."
Prop.SubjectFill="Subject size in frame"
Prop.Headroom="Headroom"
Prop.OffsetX="Horizontal offset"
Prop.OffsetY="Vertical offset"
Prop.SafeMargin="Safe margin beside the subject"
Prop.Aspect="Output aspect ratio"
Aspect.Source="Same as camera"
Aspect.9x16="9:16 vertical (YouTube Shorts / Instagram / Facebook / TikTok - 1080x1920)"
Prop.Scaling="Zoom scaling quality"
Scaling.Bilinear="Bilinear (fastest)"
Scaling.Bicubic="Bicubic (sharper)"
Prop.OutputSize="Output resolution"
OutputSize.Auto="Auto (camera size; 1080 short side for other aspects, e.g. 9:16 = 1080x1920)"
OutputSize.Native="Native crop pixels (no scaling at zoom 1.0)"
Prop.OutputSize.Desc="The size of the video this filter produces. For a vertical 1080x1920 stream keep Auto with 9:16 - the source then exactly fills a 1080x1920 canvas."
Prop.Sharpen="Detail sharpening (bicubic only)"
Prop.Sharpen.Desc="Restores edge contrast when the crop is enlarged - recommended 20-40% for 9:16 vertical output from a 1080p camera. 0 = off (exact pixels)."
Status.Output="Output"
Status.Camera="from camera"
Status.Upscale="enlarged"
Status.Soft=" (soft - a 4K camera or some sharpening helps)"
Status.MaxZoom="max zoom"
Status.Guarded=" (limited by the detail guard)"
Prop.MaxEnlarge="Detail guard: maximum enlargement"
Prop.MaxEnlarge.Desc="Zoom is limited so camera pixels are never enlarged more than this. Vertical 9:16 from a 1080p camera is already enlarged 1.78x at zoom 1.0, so with 2.0x it pans but hardly zooms; a 4K camera keeps the full zoom range. Raise it to allow more (softer) zoom."

Prop.AutoZoom="Enable auto zoom"
Prop.MinZoom="Minimum zoom"
Prop.MaxZoom="Maximum zoom"
Prop.MaxZoom.Desc="Digital zoom enlarges camera pixels - it cannot add detail. Keep it around 1.4x for a 1080p camera; a 4K camera can go to about 2x without visible softness."
Prop.FixedZoom="Zoom (when auto zoom is off)"
Prop.ZoomSpeed="Zoom speed"
Prop.ZoomSmoothing="Zoom smoothing"
Prop.ZoomDeadband="Zoom dead band (ignore small size changes)"

Prop.TrackingSpeed="Maximum tracking speed"
Prop.TrackingSpeed.Desc="Fastest pan/tilt, as a percentage of the camera width per second."
Prop.Smoothing="Movement smoothing"
Prop.DeadZoneX="Horizontal dead zone"
Prop.DeadZone.Desc="The person can move this far from the framing center without the shot moving. Larger = calmer, more cinematic."
Prop.DeadZoneY="Vertical dead zone"
Prop.AccelLimit="Acceleration limit (0 = off)"

Prop.PulpitEnabled="Enable pulpit anchor"
Prop.PulpitEnabled.Desc="While the preacher stands inside the pulpit zone the shot stays perfectly still on the pulpit; it follows only when they walk out of it."
Prop.PulpitX="Pulpit position (from left)"
Prop.PulpitWidth="Pulpit zone width"
Prop.ReturnToPulpit="When the preacher is lost, return to the pulpit"

Prop.MaxSubjects="Maximum people in the group shot"
Prop.GroupMinSize="Ignore people smaller than (relative to the largest)"
Prop.GroupMinSize.Desc="Filters out the congregation or audience in the background."

Prop.LostTimeout="Lost person timeout"
Prop.HoldPosition="Hold the last framing while the person is missing"
Prop.ReturnToWide="After the timeout, return to a wide shot"
Prop.RecoverySpeed="Return-to-wide smoothing"
Prop.ReacquireRadius="Re-acquire distance (fraction of frame width)"

Manual.Info="These controls are also available as hotkeys: OBS Settings > Hotkeys, under the name of this filter."

Prop.Model="AI model"
Model.Nano="YOLOX-Nano (fastest, recommended)"
Model.Tiny="YOLOX-Tiny (more accurate, ~3x more CPU)"
Model.Custom="Custom YOLOX ONNX model"
Prop.CustomModel="Custom model file"
Prop.DetectionFps="Detection rate"
Prop.DetectionFps.Desc="How many frames per second are analysed by the AI. Independent of the video frame rate - the framing moves smoothly at full frame rate regardless."
Prop.Threads="CPU threads for AI"
Prop.UseGpu="Use GPU acceleration (DirectML)"
Prop.UseGpu.Desc="Runs the AI on a DirectX 12 GPU (works on GTX 1650/1660 - no RTX, CUDA or TensorRT needed). Falls back to CPU automatically. Note: it shares the GPU with OBS rendering and NVENC."

Prop.ShowBoxes="Show bounding boxes"
Prop.ShowIds="Show tracking IDs"
Prop.ShowStats="Show detection FPS / inference time / zoom"
Prop.ShowGuides="Show dead zone, pulpit zone and stage area"
Prop.DiagLogs="Write diagnostic logs (every 10 s to the OBS log)"
Debug.Info="Boxes and stats are shown in this Filters window preview (and Studio Mode preview / source projectors). They are never added to your stream, recording or virtual camera."

About="V Media AI AutoFrame by V Media Production. All processing happens locally on this computer: no video leaves the PC, no internet connection, no face recognition."

