name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            third_party/dl
            third_party/models
          key: deps-${{ hashFiles('scripts/setup.ps1') }}

      - name: Install tools
        shell: pwsh
        run: |
          choco install innosetup ffmpeg -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Dependencies (OBS API headers + import libs, ONNX Runtime, DirectML, models)
        shell: pwsh
        run: ./scripts/setup.ps1

      - name: ABI check (OBS 30.0 API vs OBS 33.0.1)
        shell: pwsh
        run: ./scripts/abi-check.ps1

      - name: Test media
        shell: pwsh
        continue-on-error: true   # third-party CDN; the detector test skips clips it cannot get
        run: ./tests/fetch-test-media.ps1

      - name: Build + unit tests + detector test
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: VMedia-AI-AutoFrame-windows-x64
          path: release/*
